<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>孤胆枪手：蜂巢浩劫</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="scanlines"></div>

<!-- ==================== 魂斗罗风格入场动画 ==================== -->
<div id="intro" class="intro hidden">
  <div class="intro-flash"></div>
  <div class="intro-solider">SOLDIER</div>
  <div class="intro-logo">
    <h1 class="intro-title">孤胆枪手</h1>
    <div class="intro-sub">蜂巢浩劫</div>
  </div>
  <div class="intro-en">ALIEN SHOOTER · HIVE CALAMITY</div>
  <div class="intro-press">— 按任意键开始 —</div>
</div>

<!-- ==================== 通关黑屏演出 ==================== -->
<div id="cinema" class="cinema hidden">
  <canvas id="cinema-canvas"></canvas>
  <div class="cinema-center">
    <div class="cinema-stamp">E A R T H &nbsp; S A V E D</div>
    <div id="cinema-big" class="cinema-big"></div>
    <div id="cinema-sub" class="cinema-sub"></div>
  </div>
</div>

<!-- ==================== 主菜单 ==================== -->
<div id="scene-menu" class="scene">
  <div class="menu-wrap">
    <div class="title-block">
      <div class="subtitle">ALIEN SHOOTER · ROGUELIKE</div>
      <h1 class="game-title">孤胆枪手</h1>
      <div class="game-title-sub">蜂巢浩劫</div>
    </div>
    <div class="menu-buttons">
      <button class="menu-btn primary" data-action="single">单人模式</button>
      <button class="menu-btn" data-action="multi">多人模式 <span class="tag">未开放</span></button>
      <button class="menu-btn" data-action="codex">图鉴</button>
      <button class="menu-btn" data-action="settings">设置</button>
      <button class="menu-btn dev-btn" data-action="dev">开发者模式</button>
    </div>
    <div class="menu-footer">PC 端 · 鼠标 + 键盘操作 · v0.4</div>
    <div id="menu-best" class="menu-best"></div>
  </div>
</div>

<!-- ==================== 剧情 ==================== -->
<div id="scene-story" class="scene hidden">
  <div class="story-wrap">
    <div id="story-slide" class="story-slide"></div>
    <div class="story-nav">
      <span id="story-progress" class="story-progress">1 / 5</span>
      <button id="story-skip" class="menu-btn small">跳过剧情</button>
      <button id="story-next" class="menu-btn primary small">下一页</button>
    </div>
  </div>
</div>

<!-- ==================== 图鉴 ==================== -->
<div id="scene-codex" class="scene hidden">
  <div class="panel-wrap">
    <h2 class="panel-title">图 鉴</h2>
    <div class="tabs" id="codex-tabs">
      <button class="tab active" data-tab="enemy">敌人</button>
      <button class="tab" data-tab="weapon">武器</button>
      <button class="tab" data-tab="level">关卡</button>
      <button class="tab" data-tab="lore">档案</button>
    </div>
    <div id="codex-content" class="codex-content"></div>
    <div class="panel-actions">
      <button class="menu-btn" id="codex-back">返回</button>
    </div>
  </div>
</div>

<!-- ==================== 设置 ==================== -->
<div id="scene-settings" class="scene hidden">
  <div class="panel-wrap narrow">
    <h2 class="panel-title">设 置</h2>
    <div class="settings-list">
      <label class="setting-row">
        <span>主音量</span>
        <input type="range" id="set-volume" min="0" max="100" value="70">
        <span id="set-volume-val" class="setting-val">70%</span>
      </label>
      <label class="setting-row">
        <span>音效 / 音乐</span>
        <button class="toggle" id="set-sfx" data-on="true">开</button>
      </label>
      <label class="setting-row">
        <span>难度</span>
        <div class="seg" id="set-diff">
          <button data-v="easy">简单</button>
          <button data-v="normal" class="active">普通</button>
          <button data-v="hard">困难</button>
        </div>
      </label>
      <label class="setting-row">
        <span>屏幕震动</span>
        <button class="toggle" id="set-shake" data-on="true">开</button>
      </label>
      <label class="setting-row">
        <span>伤害数字</span>
        <button class="toggle" id="set-dmg" data-on="true">开</button>
      </label>
    </div>
    <div class="panel-actions">
      <button class="menu-btn" id="set-reset-codex">重置图鉴进度</button>
      <button class="menu-btn primary" id="set-back">返回</button>
    </div>
  </div>
</div>

<!-- ==================== 暂停 ==================== -->
<div id="scene-pause" class="scene hidden">
  <div class="menu-wrap small">
    <h2 class="pause-title">暂 停</h2>
    <div id="pause-stats" class="pause-stats"></div>
    <div class="pause-hint">WASD 移动 · 左键射击 · 右键手雷 · 空格冲刺 · 1-7 切换武器 · 清空敌人后进入出口门</div>
    <div class="menu-buttons">
      <button class="menu-btn primary" data-action="resume">继续游戏</button>
      <button class="menu-btn" data-action="restart">重新开始本局</button>
      <button class="menu-btn" data-action="dev">开发者模式</button>
      <button class="menu-btn" data-action="quit">返回主菜单</button>
    </div>
  </div>
</div>

<!-- ==================== 开发者模式 ==================== -->
<div id="scene-dev" class="scene hidden">
  <div class="panel-wrap narrow">
    <h2 class="panel-title">开 发 者 模 式</h2>
    <div class="dev-note">测试辅助功能，随时可开关。游戏中按 Esc → 开发者模式 也可进入。</div>
    <div class="settings-list">
      <label class="setting-row">
        <span>无敌模式</span>
        <button class="toggle" id="dev-invincible" data-on="false">关</button>
      </label>
      <label class="setting-row">
        <span>无限弹药</span>
        <button class="toggle" id="dev-ammo" data-on="false">关</button>
      </label>
      <label class="setting-row">
        <span>解锁全部武器</span>
        <button class="toggle" id="dev-weapons" data-on="false">关</button>
      </label>
      <label class="setting-row">
        <span>移速翻倍</span>
        <button class="toggle" id="dev-speed" data-on="false">关</button>
      </label>
      <label class="setting-row">
        <span>跳过关卡</span>
        <button class="menu-btn small" id="dev-skip">立即通关当前关卡</button>
      </label>
    </div>
    <div class="panel-actions">
      <button class="menu-btn primary" id="dev-back">返回</button>
    </div>
  </div>
</div>

<!-- ==================== 结算 ==================== -->
<div id="scene-gameover" class="scene hidden">
  <div class="menu-wrap small">
    <h2 class="over-title">你 阵 亡 了</h2>
    <div id="over-stats" class="stats"></div>
    <div class="menu-buttons">
      <button class="menu-btn primary" data-action="retry">重新挑战</button>
      <button class="menu-btn" data-action="quit">返回主菜单</button>
    </div>
  </div>
</div>

<!-- ==================== 胜利 ==================== -->
<div id="scene-victory" class="scene hidden">
  <div class="menu-wrap small">
    <h2 class="victory-title">任 务 完 成</h2>
    <div id="victory-stats" class="stats"></div>
    <div class="menu-buttons">
      <button class="menu-btn primary" data-action="retry">再来一局</button>
      <button class="menu-btn" data-action="quit">返回主菜单</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/codex-data.js"></script>
<script src="js/entities.js"></script>
<script src="js/map.js"></script>
<script src="js/levels.js"></script>
<script src="js/scenes.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
